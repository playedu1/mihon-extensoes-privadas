name: Compilar extensões Mihon

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout das fontes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: private

      - name: Checkout do framework Keiyoushi
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: b2f43180511e576bb235800e8958531489d6692b
          persist-credentials: false
          path: upstream

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar módulos e gerar ícones
        run: |
          python3 private/scripts/prepare_upstream.py private/src upstream
          python3 private/scripts/generate_icons.py
          cp -r private/src/pt/blitztoons/res upstream/src/pt/blitztoons/

      - name: Compilar APKs debug
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mapfile -t modules < <(python3 ../private/scripts/prepare_upstream.py ../private/src . --list-only)
          test "${#modules[@]}" -gt 0
          tasks=()
          for module in "${modules[@]}"; do
            tasks+=("${module}:assembleDebug")
          done
          for module in "${modules[@]}"; do
            tasks+=("${module}:generateSourceInfo")
          done
          ./gradlew "${tasks[@]}" --stacktrace --no-daemon

      - name: Verificar APK e checksum
        shell: bash
        run: |
          set -euo pipefail
          find upstream/src -type f -path '*/build/outputs/apk/debug/*.apk' -print -exec sha256sum {} \;
          test -n "$(find upstream/src -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

      - name: Montar loja Mihon (GitHub raw)
        run: |
          python3 private/scripts/build_private_repo.py \
            --build-root upstream/src \
            --store site \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/repo"

      - name: Salvar loja para publicação
        uses: actions/upload-artifact@v4
        with:
          name: mihon-site-staging
          path: site/
          if-no-files-found: error
          retention-days: 1

      - name: Guardar APK como artifact privado
        uses: actions/upload-artifact@v4
        with:
          name: mihon-extensoes-apk-debug
          path: upstream/src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar índice e APK na branch repo
    needs: apk
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout com token restrito de publicação
        uses: actions/checkout@v4
        with:
          ref: main
          path: published
          fetch-depth: 0

      - name: Recuperar apenas o pacote compilado
        uses: actions/download-artifact@v4
        with:
          name: mihon-site-staging
          path: site

      - name: Atualizar exclusivamente a branch repo
        shell: bash
        run: |
          set -euo pipefail
          git -C published config user.name "github-actions[bot]"
          git -C published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published fetch origin repo || true
          if git -C published show-ref --verify --quiet refs/remotes/origin/repo; then
            git -C published switch -C repo origin/repo
          else
            git -C published switch --orphan repo
          fi
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. published/
          git -C published add -A
          if git -C published diff --cached --quiet && git -C published rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "Catálogo sem alterações"
            exit 0
          fi
          git -C published commit -m "publish: índice e APK Mihon"
          git -C published push origin HEAD:repo
