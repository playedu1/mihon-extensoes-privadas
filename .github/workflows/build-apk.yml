name: Compilar extensões Mihon

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório privado
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: private

      - name: Checkout do framework Keiyoushi
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: b2f43180511e576bb235800e8958531489d6692b
          persist-credentials: false
          path: upstream

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar módulos e gerar ícones
        run: |
          python3 private/scripts/prepare_upstream.py private/src upstream
          python3 private/scripts/generate_icons.py
          cp -r private/src/pt/blitztoons/res upstream/src/pt/blitztoons/

      - name: Compilar APKs debug
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mapfile -t modules < <(python3 ../private/scripts/prepare_upstream.py ../private/src . --list-only)
          test "${#modules[@]}" -gt 0
          tasks=()
          for module in "${modules[@]}"; do
            tasks+=("${module}:assembleDebug")
          done
          ./gradlew "${tasks[@]}" --stacktrace --no-daemon

      - name: Verificar APK e checksum
        shell: bash
        run: |
          set -euo pipefail
          find upstream/src -type f -path '*/build/outputs/apk/debug/*.apk' -print -exec sha256sum {} \;
          test -n "$(find upstream/src -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

      - name: Guardar APK como artifact privado
        uses: actions/upload-artifact@v4
        with:
          name: mihon-extensoes-apk-debug
          path: upstream/src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
