name: Diagnosticar catálogo BlitzToons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-blitztoons.yml'
      - 'tests/probe_site.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python3 -u tests/probe_site.py
